name: 更新节目单

on:
  schedule:
    - cron: '43 1 * * *'  # 每天 09:43
    - cron: '4 16 * * *'   # 每天 00:04
  workflow_dispatch:

# 显式声明权限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y wget gzip

      - name: Download and check for changes
        id: check_update
        run: |
          echo "📥 正在下载 EPG 文件..."
          
          # 1. 尝试下载 (重试3次)
          SUCCESS=false
          for i in 1 2 3; do
            if wget --tries=2 --timeout=30 "https://github.com/kuke31/xmlgz/raw/main/e.xml.gz" -O e.xml.gz; then
              SUCCESS=true
              break
            fi
            echo "⚠️ 第 $i 次下载失败，等待 60秒..."
            sleep 60
          done

          if [ "$SUCCESS" != "true" ]; then
            echo "❌ 下载彻底失败，退出任务"
            exit 1
          fi

          # 2. 解压文件
          echo "📦 解压文件..."
          if ! gunzip -f e.xml.gz; then
            echo "❌ 解压失败"
            exit 1
          fi

          # 3. 计算新文件指纹
          NEW_MD5=$(md5sum e.xml | cut -d' ' -f1)
          NEW_SIZE=$(wc -c < e.xml)
          echo "新文件信息: ${NEW_SIZE} bytes, MD5: ${NEW_MD5}"

          # 4. 获取旧文件指纹并对比
          OLD_MD5=""
          if git show HEAD:e.xml &>/dev/null; then
            OLD_MD5=$(git show HEAD:e.xml | md5sum | cut -d' ' -f1)
            echo "旧文件 MD5: $OLD_MD5"
          else
            echo "🆕 首次运行，无历史记录"
          fi

          # 5. 设置输出变量
          if [ "$NEW_MD5" = "$OLD_MD5" ] && [ -n "$OLD_MD5" ]; then
            echo "⏭️ 文件未发生变化，跳过提交"
            echo "updated=false" >> $GITHUB_OUTPUT
          else
            echo "✅ 文件已更新，准备提交"
            echo "updated=true" >> $GITHUB_OUTPUT
            echo "NEW_MD5=$NEW_MD5" >> $GITHUB_ENV
            echo "NEW_SIZE=$NEW_SIZE" >> $GITHUB_ENV
            echo "OLD_MD5=${OLD_MD5:-None}" >> $GITHUB_ENV
          fi

      - name: Commit and push changes
        if: steps.check_update.outputs.updated == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          git pull --rebase origin $BRANCH || true
          
          git add e.xml
          
          if git diff --staged --quiet; then
            echo "⚠️ Git 暂存区无变化"
            exit 0
          fi
          
          git commit -m "Update EPG file" \
            -m "Date: $(date -u '+%Y-%m-%d %H:%M UTC')" \
            -m "Size: ${{ env.NEW_SIZE }} bytes" \
            -m "MD5: ${{ env.NEW_MD5 }}"
            
          git push origin $BRANCH

      - name: Skip message
        if: steps.check_update.outputs.updated == 'false'
        run: echo "⏭️ 本次运行跳过更新"
