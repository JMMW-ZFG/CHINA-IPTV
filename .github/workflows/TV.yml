name: Live streaming source

on:
  schedule:
    # 每天 UTC 08:00 运行（北京时间 16:00）
    - cron: "0 8 * * *"
  workflow_dispatch: # 允许手动触发

# 显式声明工作流权限，确保有写入代码的权限
permissions:
  contents: write

jobs:
  sort_channels:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # ✅ 升级到最新稳定版 v4
        uses: actions/checkout@v4
        with:
          # 确保使用 token 进行检出，以便后续有权限推送
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        # ✅ 升级到最新稳定版 v5
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run Python script
        run: |
          python TV/sort_channels.py

      - name: Commit and push sorted file
        run: |
          # 配置 Git 用户信息
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 添加文件并尝试提交
          git add TV/live.txt
          # 如果文件没有变化，git commit 会报错，这里用 || true 忽略错误，防止流程中断
          git commit -m "Update sorted channels" || echo "No changes to commit"
          
          # 推送到远程仓库
          git push

  clean:
    needs: sort_channels
    runs-on: ubuntu-latest
    steps:
      - name: Delete older workflow runs and artifacts
        # 清理历史运行记录，保持 Actions 页面整洁
        uses: Mattraks/delete-workflow-runs@main
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 1
          keep_minimum_runs: 1
