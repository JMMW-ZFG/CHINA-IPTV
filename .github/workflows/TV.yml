name: Live streaming source

on:
  schedule:
    # 每天 UTC 08:00 运行（北京时间 16:00）
    - cron: "0 8 * * *"
  workflow_dispatch: # 允许手动触发

# 显式声明工作流权限
permissions:
  contents: write

jobs:
  sort_channels:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run Python script
        run: |
          echo "🚀 开始运行频道排序脚本..."
          python TV/sort_channels.py
          echo "✅ 脚本运行完成"

      - name: Check for changes
        id: git_check
        run: |
          # 检查是否有文件变动
          if [ -z "$(git status --porcelain)" ]; then
            echo "⚠️ 文件没有变化，跳过提交"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "🔄 检测到文件变化，准备提交"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push updated file
        if: steps.git_check.outputs.has_changes == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 获取当前分支名
          BRANCH_NAME=$(git rev-parse --abbrev-ref HEAD)
          
          # 自动拉取最新代码（防止冲突）
          git pull --rebase --autostash origin $BRANCH_NAME
          
          # 添加所有变动文件（或者你可以指定 TV/tv.txt）
          git add .
          
          # 提交
          git commit -m "Update TV channels list" \
            -m "- Date: $(date -u '+%Y-%m-%d %H:%M UTC')" \
            -m "- Auto-generated by GitHub Actions"
          
          # 推送
          git push origin $BRANCH_NAME
          echo "✅ 推送成功"

      - name: Skip message
        if: steps.git_check.outputs.has_changes == 'false'
        run: |
          echo "⏭️ 本次运行没有产生新内容，无需更新仓库"
